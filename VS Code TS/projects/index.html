<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2eee2">
<title>projects | toosi studio</title>
<meta name="description" content="toosi studio: digital and physical projects.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@500&family=Libre+Caslon+Text:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="inner">
<div class="cur-scope">
<header class="top">
<a class="disp logo" href="/">toosi studio</a>
<nav class="nav" aria-label="Main"><a class="nl mono hd" aria-current="page" href="/projects/">projects</a><a class="nl mono hd" href="/objects/">objects</a><a class="nl mono hd" href="/about/">about</a><a class="nl mono hd" href="/contact/">contact</a></nav>
</header>
<div class="hero ptitle"><h1 class="mono kicker">projects</h1>
<div class="disp tabs" role="tablist" aria-label="Project type"><button role="tab" id="tab-digital" aria-controls="digital" data-cat="digital">digital</button><button role="tab" id="tab-physical" aria-controls="physical" data-cat="physical">physical</button></div>
</div>
<main class="plist">
<section id="digital" role="tabpanel" aria-labelledby="tab-digital">
<ul class="grid">
<li><a href="/projects/queer-connected/"><span class="thumb"><img src="/projects/queer-connected/thumb.jpg" alt="" width="640" height="373"></span><span class="mono name">Queer Connected</span><span class="mono meta">website &middot; 2026</span></a></li>
</ul>
</section>
<section id="physical" role="tabpanel" aria-labelledby="tab-physical" hidden>
<p class="mono">coming soon</p>
</section>
</main>
<footer class="foot">
<p class="mono sm">&copy; 2026</p>
<div><h2 class="mono md">contact</h2><a class="email sm-email" href="mailto:connect@toosi.studio">connect@toosi.studio</a></div>
<div class="nav"><h2 class="mono md">pages</h2><div class="foot-links"><a class="nl mono sm" href="/projects/">projects</a><a class="nl mono sm" href="/objects/">objects</a><a class="nl mono sm" href="/about/">about</a><a class="nl mono sm" href="/contact/">contact</a></div></div>
</footer>
</div>
<script>
(() => {
  const cats = ['digital', 'physical'];
  const show = c => {
    if (!cats.includes(c)) c = 'digital';
    cats.forEach(k => {
      document.getElementById(k).hidden = k !== c;
      document.getElementById('tab-' + k).setAttribute('aria-selected', k === c);
    });
  };
  document.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => {
    history.replaceState(null, '', '#' + b.dataset.cat);
    show(b.dataset.cat);
  }));
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
<script src="/js/cursor.js" defer></script>
</body>
</html>
